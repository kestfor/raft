x-node: &node
  build: .
  image: raft-election:local
  init: true
  stop_grace_period: 5s
  command: ["--config=/etc/raft/config.yaml"]
  environment:
    CLICOLOR_FORCE: ${CLICOLOR_FORCE:-1}
    LOG_FORMAT: ${LOG_FORMAT:-plain}
    LOG_LEVEL: ${LOG_LEVEL:-debug}
  healthcheck:
    test: ["CMD", "/grpc_health_probe", "-addr=127.0.0.1:9000", "-connect-timeout=500ms", "-rpc-timeout=500ms"]
    interval: 5s
    timeout: 2s
    start_period: 3s
    retries: 3

services:
  node1:
    <<: *node
    volumes:
      - ./configs/compose/node1.yaml:/etc/raft/config.yaml:ro
      - node1-data:/var/lib/raft
    ports:
      - "9001:9000"
      - "18001:18000"
  node2:
    <<: *node
    volumes:
      - ./configs/compose/node2.yaml:/etc/raft/config.yaml:ro
      - node2-data:/var/lib/raft
    ports:
      - "9002:9000"
      - "18002:18000"
  node3:
    <<: *node
    volumes:
      - ./configs/compose/node3.yaml:/etc/raft/config.yaml:ro
      - node3-data:/var/lib/raft
    ports:
      - "9003:9000"
      - "18003:18000"

volumes:
  node1-data:
  node2-data:
  node3-data:
